<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Robot Face</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="robot-container">
    <!-- Helmet / Head Frame -->
    <div class="robot-head">
      <!-- Ear Caps -->
      <div class="ear left"></div>
      <div class="ear right"></div>
      
      <!-- Screen / Visor -->
      <div class="visor" id="visor">
        <div class="eye left-eye"></div>
        <div class="eye right-eye"></div>
      </div>
    </div>

    <!-- Panel Butang Tukar Ekspresi -->
    <div class="controls">
      <button onclick="setExpression('normal')">Normal</button>
      <button onclick="setExpression('happy')">Happy</button>
      <button onclick="setExpression('sad')">Sad</button>
      <button onclick="setExpression('angry')">Angry</button>
      <button onclick="setExpression('surprised')">Surprised</button>
      <button onclick="setExpression('sleep')">Sleep</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
