<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matcha AI Pet - Offline</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="tamagotchi-case">
    <div class="screen">
      <!-- Status Bar -->
      <div class="status-bar">
        <span id="hungerStatus">Lapar: OK</span>
        <span id="cleanStatus">Kebersihan: OK</span>
      </div>

      <!-- Muka / Emoji Pet (Besar & Interaktif) -->
      <div class="pet-face" id="petFace" onclick="touchPet()">
        <div class="eye left">
          <div class="pupil"></div>
        </div>
        <div class="eye right">
          <div class="pupil"></div>
        </div>
      </div>
      
      <!-- Paparan Teks & Emoji Reaksi -->
      <div class="reaction-display">
        <div id="emojiText">ฅ(•⩊•)ฅ</div>
        <p id="dialogBox">Hai! Saya Matcha. sentuh muka saya!</p>
      </div>
    </div>

    <!-- Butang Tindakan Khas iPad -->
    <div class="controls">
      <button class="btn feed-btn" onclick="feedPet()">🍕 Makan</button>
      <button class="btn bath-btn" onclick="bathPet()">🛁 Mandi</button>
      <button class="btn play-btn" onclick="playPet()">🎮 Main</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
